name: Release Windows app ZIP

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load matching changelog entry
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(tr -d '\r\n' < VERSION)"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::Tag version ($tag_version) does not match VERSION ($file_version)."
            exit 1
          fi
          if ! awk -v header="## [$tag_version]" '
            index($0, header) == 1 && substr($0, length(header) + 1, 1) == " " {
              found = 1
              next
            }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md; then
            echo "::error::No changelog entry found for version $tag_version."
            exit 1
          fi
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::The changelog entry for version $tag_version is empty."
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build standalone Windows app
        run: python -m PyInstaller --noconfirm --clean "VFERDZ Converter.spec"
      - name: Put version file beside executable
        run: |
          Copy-Item "dist\VFERDZ-CONVERTER\_internal\VERSION" "dist\VFERDZ-CONVERTER\VERSION"
          Remove-Item "dist\VFERDZ-CONVERTER\_internal\VERSION"
      - name: Package app folder in ZIP
        run: |
          python -c @'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          bundle = Path('dist') / 'VFERDZ-CONVERTER'
          archive_path = Path('vferdz-converter-${{ github.ref_name }}.zip')
          with ZipFile(archive_path, 'w', ZIP_DEFLATED) as archive:
              for path in sorted(bundle.rglob("*")):
                  if path.is_file():
                      archive.write(
                          path,
                          (Path(bundle.name) / path.relative_to(bundle)).as_posix(),
                      )
          '@
      - name: Verify ZIP contains the complete app bundle
        run: |
          python -c @'
          from zipfile import ZipFile

          with ZipFile('vferdz-converter-${{ github.ref_name }}.zip') as archive:
              names = set(archive.namelist())
              required = {
                  'VFERDZ-CONVERTER/VFERDZ Converter.exe',
                  'VFERDZ-CONVERTER/VERSION',
                  'VFERDZ-CONVERTER/_internal/Pages/index.html',
                  'VFERDZ-CONVERTER/_internal/Assets/Images/logo.ico',
                  'VFERDZ-CONVERTER/_internal/Assets/CSS/app.css',
                  'VFERDZ-CONVERTER/_internal/Assets/JS/app.js',
                  'VFERDZ-CONVERTER/_internal/Scripts/deno.exe',
              }
              missing = required - names
              assert not missing, f'Missing bundle files: {sorted(missing)}'
              assert all(name.startswith('VFERDZ-CONVERTER/') for name in names)
              assert all(not name.startswith('/') and '..' not in name.split('/') for name in names)
          '@
      - name: Publish app ZIP on GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: false
          body_path: release-notes.md
          files: vferdz-converter-${{ github.ref_name }}.zip
