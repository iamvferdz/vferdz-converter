name: Release ZIP

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load matching changelog entry
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(tr -d '\r\n' < VERSION)"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::Tag version ($tag_version) does not match VERSION ($file_version)."
            exit 1
          fi
          if ! awk -v header="## [$tag_version]" '
            index($0, header) == 1 && substr($0, length(header) + 1, 1) == " " {
              found = 1
              next
            }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md; then
            echo "::error::No changelog entry found for version $tag_version."
            exit 1
          fi
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::The changelog entry for version $tag_version is empty."
            exit 1
          fi
      - name: Create project ZIP
        run: |
          git archive \
            --format=zip \
            --prefix="vferdz-converter-${GITHUB_REF_NAME}/" \
            HEAD \
            -o "vferdz-converter-${GITHUB_REF_NAME}.zip"
      - name: Publish ZIP on GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: false
          body_path: release-notes.md
          files: vferdz-converter-${{ github.ref_name }}.zip
