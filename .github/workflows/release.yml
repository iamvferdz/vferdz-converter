name: Release ZIP

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate commit message notes
        shell: bash
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [ -n "$previous_tag" ]; then
            printf '## Changes since %s\n\n' "$previous_tag" > release-notes.md
            git log --format='- %s (`%h`)' "$previous_tag..$GITHUB_REF_NAME" >> release-notes.md
          else
            printf '## Changes\n\n' > release-notes.md
            git log --format='- %s (`%h`)' "$GITHUB_REF_NAME" >> release-notes.md
          fi
      - name: Create project ZIP
        run: |
          git archive \
            --format=zip \
            --prefix="vferdz-converter-${GITHUB_REF_NAME}/" \
            HEAD \
            -o "vferdz-converter-${GITHUB_REF_NAME}.zip"
      - name: Publish ZIP on GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: false
          body_path: release-notes.md
          files: vferdz-converter-${{ github.ref_name }}.zip
