name: Release Windows EXE ZIP

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load matching changelog entry
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(tr -d '\r\n' < VERSION)"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::Tag version ($tag_version) does not match VERSION ($file_version)."
            exit 1
          fi
          if ! awk -v header="## [$tag_version]" '
            index($0, header) == 1 && substr($0, length(header) + 1, 1) == " " {
              found = 1
              next
            }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md; then
            echo "::error::No changelog entry found for version $tag_version."
            exit 1
          fi
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::The changelog entry for version $tag_version is empty."
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build standalone Windows app
        run: python -m PyInstaller --noconfirm --clean "VFERDZ Converter.spec"
      - name: Package executable in ZIP
        run: Compress-Archive -Path "dist\VFERDZ Converter.exe" -DestinationPath "vferdz-converter-${{ github.ref_name }}.zip" -CompressionLevel Optimal
      - name: Verify ZIP contains only the executable
        run: python -c "import zipfile; names = zipfile.ZipFile('vferdz-converter-${{ github.ref_name }}.zip').namelist(); assert names == ['VFERDZ Converter.exe'], names"
      - name: Publish app ZIP on GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: false
          body_path: release-notes.md
          files: vferdz-converter-${{ github.ref_name }}.zip
